<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>CleanAI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font: 13px system-ui, sans-serif;
        background: #1b1d22;
        color: #e6e6e6;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: #24272e;
        border-bottom: 1px solid #333;
      }
      .sp {
        flex: 1;
      }
      button {
        background: #3a6df0;
        color: #fff;
        border: 0;
        border-radius: 4px;
        padding: 5px 11px;
        cursor: pointer;
      }
      button:disabled {
        background: #444;
        color: #888;
        cursor: default;
      }
      select,
      input[type="text"] {
        background: #14161a;
        color: #e6e6e6;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px;
      }
      #status {
        padding: 5px 12px;
        background: #14161a;
        min-height: 26px;
        color: #8bd48b;
      }
      #status.bad {
        color: #ff7b7b;
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #gridwrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #pager {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 6px 12px;
      }
      #grid {
        flex: 1;
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: max-content;
        min-width: 100%;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 3px 8px;
        white-space: nowrap;
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      th {
        position: sticky;
        top: 0;
        background: #2b2f37;
      }
      td.null {
        color: #777;
        font-style: italic;
      }
      .idx {
        color: #888;
        background: #20232a;
        text-align: right;
      }
      aside {
        width: 430px;
        border-left: 1px solid #333;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px;
      }
      .tab {
        background: #2b2f37;
      }
      .tab.on {
        background: #3a6df0;
      }
      #panel {
        flex: 1;
        overflow: auto;
        padding: 8px 12px;
      }
      .card {
        background: #24272e;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .card.undone {
        opacity: 0.45;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
      }
      .muted {
        color: #999;
      }
      code {
        color: #9cdcfe;
        word-break: break-all;
      }
      .field {
        display: block;
        margin-bottom: 8px;
      }
      .field span {
        display: block;
        margin-bottom: 2px;
        color: #aaa;
      }
      .field select,
      .field input[type="text"] {
        width: 100%;
      }
      .bar {
        margin-bottom: 6px;
      }
      .track {
        background: #14161a;
        height: 8px;
        border-radius: 4px;
      }
      .fill {
        background: #3ac47d;
        height: 8px;
        border-radius: 4px;
      }
      .ptable td,
      .ptable th {
        font-size: 12px;
        white-space: normal;
      }
      .busy,
      .busy button {
        cursor: progress;
      }
      .busy button {
        pointer-events: none;
      }
      .warn {
        color: #ffcc66;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="open">Open file…</button>
      <span id="importbox" hidden>
        <select id="sheet" hidden></select>
        <label><input type="checkbox" id="alltext" /> Keep all as text</label>
        <button id="load">Load</button>
      </span>
      <span class="sp"></span>
      <button id="undo" disabled>Undo</button>
      <button id="redo" disabled>Redo</button>
      <button id="reset" disabled>Reset</button>
      <button id="export" disabled>Export…</button>
    </header>
    <div id="status">Open a CSV or Excel file to begin.</div>
    <main>
      <section id="gridwrap">
        <div id="pager">
          <button id="prev" disabled>‹ Prev</button><span id="pageinfo"></span
          ><button id="next" disabled>Next ›</button>
        </div>
        <div id="grid"></div>
      </section>
      <aside>
        <div id="tabs"></div>
        <div id="panel"></div>
      </aside>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
